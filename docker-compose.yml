services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER:     buddy
      POSTGRES_PASSWORD: buddy
      POSTGRES_DB:       businessbuddy
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d businessbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # ── Core ──────────────────────────────────────────────────────
      DATABASE_URL:      postgresql+asyncpg://buddy:buddy@postgres:5432/businessbuddy
      SECRET_KEY:        ${SECRET_KEY:-change-me-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER:      ${LLM_PROVIDER:-anthropic}
      GROQ_API_KEY:      ${GROQ_API_KEY:-}
      GROQ_CHAT_MODEL:   ${GROQ_CHAT_MODEL:-llama-3.3-70b-versatile}
      GROQ_DOC_MODEL:    ${GROQ_DOC_MODEL:-llama-3.1-8b-instant}
      ENVIRONMENT:       ${ENVIRONMENT:-production}
      CORS_ORIGINS:      http://localhost,http://localhost:80
      FRONTEND_URL:      ${FRONTEND_URL:-http://localhost}
      # ── Documents ─────────────────────────────────────────────────
      UPLOAD_DIR:        /app/uploads
      MAX_UPLOAD_MB:     ${MAX_UPLOAD_MB:-50}
      # ── Stripe (optional) ─────────────────────────────────────────
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO:       ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS:  ${STRIPE_PRICE_BUSINESS:-}
      # ── SMTP (optional) ───────────────────────────────────────────
      SMTP_HOST:     ${SMTP_HOST:-}
      SMTP_PORT:     ${SMTP_PORT:-587}
      SMTP_USER:     ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM:     ${SMTP_FROM:-buddy@yourdomain.com}
    volumes:
      - uploads_data:/app/uploads
      - fastembed_cache:/root/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  fastembed_cache:
